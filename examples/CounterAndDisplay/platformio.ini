; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
lib_deps =
	symlink://../.. ;https://github.com/djholt/LoRaMesher.git#dev
	mikalhart/TinyGPSPlus@^1.0.3
	adafruit/Adafruit SSD1306@^2.5.1
	adafruit/Adafruit GFX Library@^1.10.13
	adafruit/Adafruit BusIO@^1.11.1

build_type = release

;Use the following build_flags to enable debug output to the library
build_flags =
	-D CORE_DEBUG_LEVEL=4

[env:heltec]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D HELTEC_V3

[env:seeed]
board = seeed_xiao_esp32s3
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = ${env.build_flags} -D SEEED_XIAO
